name: Generate 100 Commits

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Create 100 commits
        run: |
          for i in {1..100}
          do
            echo "Commit number $i - $(date)" > "file_$i.txt"
            git add "file_$i.txt"
            git commit -m "Add file $i"
          done
          
      - name: Push all commits
        run: git push
